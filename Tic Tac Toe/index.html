<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <link href="/Tic Tac Toe/styles/styles.css" rel="stylesheet"/>
    <link href="/Tic Tac Toe/styles/overlays.css" rel="stylesheet"/>
    <link href="/Tic Tac Toe/styles/config.css" rel="stylesheet"/>
    <link href="/Tic Tac Toe/styles/game.css" rel="stylesheet"/>
    <script src="/Tic Tac Toe/scripts/gamelogic.js" defer></script>
    <script src="/Tic Tac Toe/scripts/config.js" defer></script>
    <script src="/Tic Tac Toe/scripts/app.js" defer></script>
  </head>

  <body>
    
      <!-- To drop the background -->

    <div id="backdrop">
    </div>

    <header id="main-header">
      <h1>Play Tic, Tac, Toe</h1>
      <p>Built with HTML, CSS, JS and - of course - lots of love!</p>
    </header>

    <main>
    <!-- Overlay Area -->
      <aside class="modal" id="config-overlay">
        <h2>Choose Your Name</h2>
        <form>
          <div class="form-control">
            <label for="playername">Player Name</label>
            <input type="text" name="playername" id="playername" required/>
          </div>
          
          <p id="config-errors"></p>

          <div>
            <button type="reset" class=" btn btn-alt" id="cancel-name">Cancel</button>
            <button type="submit" class="btn" id="confirm-name">Confirm</button>
          </div>
        </form>
      </aside>


      <section id="game-configuration">
        <ol>
          <li>
            <article id="player-1-data">
              <h2>Player 1</h2>
              <h3>Player Name</h3>
              <p class="player-symbol">X</p>
              <button 
              class="btn btn-alt" 
              id="player-one-edit"
              data-playerid="1"
              >
              Edit
            </button>
            </article>
          </li>

          <li> 
            <article id="player-2-data">
              <h2>Player 2</h2>
              <h3>Player Name</h3>
              <p class="player-symbol">O</p>
              <button 
              class="btn btn-alt" 
              id="player-two-edit" 
              data-playerid="2"
              >
              Edit
            </button>
            </article>
          </li>
        </ol>
        <button class="btn" id="start-game-btn">Start New Game</button>
      </section>

      <!-- Game Board -->

      <section id="active-game">
        <article id="game-over">
          <h3>You won, <span id="winner-name"></span></h3>
          <p>Click "Start New Game" above,to start a new game</p>
        </article>
        <p>It's your turn <span id="active-player-name">Player Name</span></p>
        <ol id="game-board">
            <li data-col="1" data-row="1"> </li>
            <li data-col="2" data-row="1"></li>
            <li data-col="3" data-row="1"></li>

            <li data-col="1" data-row="2" ></li>
            <li data-col="2" data-row="2"></li>
            <li data-col="3" data-row="2"></li>

            <li data-col="1" data-row="3"></li>
            <li data-col="2" data-row="3"></li>
            <li data-col="3" data-row="3"></li>
        </ol>
      </section>
    </main>
  </body>
</html>
